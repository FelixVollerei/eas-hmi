<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="220" viewBox="0 0 480 220">
  <title id="schematic-title">Cooling loop equipment</title>
  <rect id="background" width="480" height="220" rx="12" fill="#f8fafc"/>
  <path id="pipe" d="M 100 110 H 370" fill="none" stroke="#64748b" stroke-width="8"/>
  <g id="pump" transform="translate(48 64)">
    <rect id="pump-body" width="112" height="88" rx="12" fill="#f59e0b" stroke="#334155" stroke-width="2"/>
    <text id="pump-label" x="56" y="49" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#0f172a">Pump standby</text>
  </g>
  <g id="tank" transform="translate(320 48)">
    <rect id="tank-body" width="100" height="124" rx="16" fill="#cbd5e1" stroke="#334155" stroke-width="2"/>
    <text id="tank-label" x="50" y="68" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#0f172a">Tank</text>
  </g>
</svg>
